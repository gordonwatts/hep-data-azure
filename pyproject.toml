[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hep-data-azure"
version = "0.1.0"
description = "Low-cost cloud-native plot portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hep_data_azure*", "portal*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hep_data_azure.settings.test"
pythonpath = ["."]
testpaths = ["tests", "portal"]
addopts = "-q"
cache_dir = "C:/tmp/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["portal/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
