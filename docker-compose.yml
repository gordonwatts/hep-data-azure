services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: hepdata
      POSTGRES_PASSWORD: hepdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hepdata -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command:
      [
        "azurite",
        "--blobHost",
        "0.0.0.0",
        "--blobPort",
        "10000",
        "--queueHost",
        "0.0.0.0",
        "--queuePort",
        "10001",
        "--location",
        "/data",
        "--debug",
        "/data/debug.log",
      ]
    volumes:
      - azurite-data:/data

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DJANGO_SECRET_KEY: docker-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://hepdata:hepdata@postgres:5432/postgres
      QUEUE_BACKEND: azure
      ARTIFACT_STORAGE_BACKEND: azure
      PLOT_RUNNER_ROOT: /app/tmp/plot-runner
      BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_QUEUE_ENDPOINT: http://azurite:10001/devstoreaccount1
      AZURE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    build: .
    command: ["bootstrap_local_demo"]
    environment:
      DJANGO_SECRET_KEY: docker-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://hepdata:hepdata@postgres:5432/postgres
      QUEUE_BACKEND: azure
      ARTIFACT_STORAGE_BACKEND: azure
      BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_QUEUE_ENDPOINT: http://azurite:10001/devstoreaccount1
      AZURE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    volumes:
      - ./secrets:/app/secrets:ro
      - ./tmp:/app/tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build: .
    command: ["runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SECRET_KEY: docker-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://hepdata:hepdata@postgres:5432/postgres
      QUEUE_BACKEND: azure
      ARTIFACT_STORAGE_BACKEND: azure
      PLOT_RUNNER_ROOT: /app/tmp/plot-runner
      BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_QUEUE_ENDPOINT: http://azurite:10001/devstoreaccount1
      AZURE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  local-job-runner:
    build: .
    command: ["run_local_job_runner", "--poll-interval", "1"]
    environment:
      DJANGO_SECRET_KEY: docker-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://hepdata:hepdata@postgres:5432/postgres
      QUEUE_BACKEND: azure
      ARTIFACT_STORAGE_BACKEND: azure
      BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_QUEUE_ENDPOINT: http://azurite:10001/devstoreaccount1
      AZURE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    volumes:
      - ./secrets:/app/secrets:ro
      - ./tmp:/app/tmp
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  plot-runner:
    build:
      context: .
      dockerfile: Dockerfile.plot-runner
    command: ["run"]
    profiles: ["plot"]
    environment:
      DJANGO_SECRET_KEY: docker-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://hepdata:hepdata@postgres:5432/postgres
      QUEUE_BACKEND: azure
      ARTIFACT_STORAGE_BACKEND: azure
      PLOT_DRIVER_EXECUTOR: codex
      PLOT_RUNNER_ROOT: /app/tmp/plot-runner
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_QUEUE_ENDPOINT: http://azurite:10001/devstoreaccount1
      AZURE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    volumes:
      - ./secrets:/app/secrets:ro
      - ./tmp:/app/tmp
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  postgres-data:
  azurite-data:
